spring.application.name=fraud-dashboard
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fraud_dashboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:fraud_user}
spring.datasource.password=${DB_PASSWORD:fraud_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.web.exposure.include=health
